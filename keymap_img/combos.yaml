layers:
  COMBOS:
    - ['', '', '', '', '', '', '', '', '', '']
    - ['', '', '', '', '', '', '', '', '', '']
    - ['', '', '', '', '', '', '', '', '', '']
    - ['', '', '', '', '', '']

combos:
  # Editing chords (the active OS profile supplies Cmd or Ctrl).
  - {p: [21, 23], k: Cut,   l: [COMBOS], a: bottom, o: 0.55}
  - {p: [21, 22], k: Copy,  l: [COMBOS], a: top,    o: -0.15}
  - {p: [22, 23], k: Paste, l: [COMBOS], a: top,    o: 0.35}

  # The same chord produces the first symbol on base/number layers and the
  # second symbol on navigation layers.
  - {p: [16, 17], k: '(<', l: [COMBOS], a: top, o: -0.25}
  - {p: [17, 18], k: ')>', l: [COMBOS], a: top, o: 0.25}
  - {p: [26, 27], k: '[{', l: [COMBOS], a: bottom, o: -0.25}
  - {p: [27, 28], k: ']}', l: [COMBOS], a: bottom, o: 0.25}

  # Left-hand vertical symbol chords.
  - {p: [1, 11],  k: '@',  l: [COMBOS]}
  - {p: [2, 12],  k: '#',  l: [COMBOS]}
  - {p: [3, 13],  k: '$',  l: [COMBOS]}
  - {p: [4, 14],  k: '%',  l: [COMBOS]}
  - {p: [11, 21], k: '`',  l: [COMBOS]}
  - {p: [12, 22], k: '\', l: [COMBOS]}
  - {p: [13, 23], k: '/',  l: [COMBOS]}
  - {p: [14, 24], k: '~',  l: [COMBOS]}

  # Right-hand vertical symbol chords.
  - {p: [5, 15],  k: '^', l: [COMBOS]}
  - {p: [6, 16],  k: '+', l: [COMBOS]}
  - {p: [7, 17],  k: '*', l: [COMBOS]}
  - {p: [8, 18],  k: '&', l: [COMBOS]}
  - {p: [15, 25], k: '_', l: [COMBOS]}
  - {p: [16, 26], k: '-', l: [COMBOS]}
  - {p: [17, 27], k: '=', l: [COMBOS]}
  - {p: [18, 28], k: '|', l: [COMBOS]}

  # Four-key safety chords.
  - {p: [0, 9, 20, 29], k: 'OFF', l: [COMBOS], a: left,  o: -0.45}
  - {p: [4, 5, 24, 25], k: BOOT, l: [COMBOS], a: right, o: 0.45}
